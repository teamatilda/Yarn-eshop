<!-- PRODUCT-DETAIL PAGE -->

@if (product(); as p) {
  <section class="product-detail">
    <img [src]="p.Image_url" [alt]="p.Title" class="product-detail__image" />
    <div class="product-detail__info">
      <h1>{{ p.Title }}</h1>
      <p class="product-detail__price">{{ p.Price }} kr</p>
    </div>
  </section>
} @else {
  <p>Laddar produkt...</p>
}
