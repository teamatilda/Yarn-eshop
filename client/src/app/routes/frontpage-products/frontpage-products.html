<!--Denna sida visas på home-page och innehåller en hero och produktkort-->

<!--hero-sektion-->
<div class="hero-section">
    <!-- Dynamisk bildkarusell -->
    <div class="carousel-gallery">
        <div class="carousel-item">
            <div class="carousel-image">
                <img src="/images/hero.jpg" alt="Stickade plagg">
            </div>
            <div class="hero-header">
                <h2>bla bla bla</h2>
            </div>
        </div>
        <div class="carousel-item">
            <div class="carousel-image">
                <img src="/images/yarn.jpg" alt="Garnnystan">
            </div>
            <div class="hero-header">
                <h2>Nyinkomna garner</h2>
            </div>
        </div>
        <div class="carousel-item">
            <div class="carousel-image">
                <img src="/images/sweater.jpg" alt="Stickad tröja">
            </div>
            <div class="hero-header">
                <h2>Handla efter mönster</h2>
            </div>
        </div>
    </div>

</div>

<!-- Produktkort -->
<section>
    <div class="product-grid">
        @for (product of products(); track product.ID) {
        <div class="product-card">
            <div class="product-card__image-wrap">
                <img [src]="product.Image_url" [alt]="product.Title" class="product-card__image">
            </div>
            <div class="product-card__body">
                <h3 class="product-card__title">{{ product.Title }}</h3>
                <p class="product-card__price">{{ product.Price }} kr</p>
            </div>
        </div>
    }
    </div>
</section>
