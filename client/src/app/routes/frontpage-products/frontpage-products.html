<!--Denna sida visas på home-page och innehåller produktkort-->

    <div class="product-grid">
        @for (product of displayedProducts(); track product.ID) {
        <a [routerLink]="['/product', product.Slug]" class="product-card">
            <div class="product-card-image-wrap">
                <img [src]="product.Image_url" [alt]="product.Title" class="product-card-image">
            </div>
            <div class="product-card-body">
                <h3 class="product-card-title">{{ product.Title }}</h3>
                <p class="product-card-price">{{ product.Price }} kr</p>
            </div>
        </a>
    }
    </div>
