<h2>Hittade x produkter</h2>

@for (product of products(); track product.ID) {
  <div class="product-card">
    <img [src]="product.Image_url" [alt]="product.Title" />
    <h3>{{ product.Title }}</h3>
    <p>{{ product.Price }} kr</p>
  </div>
}
@empty {
  <p>Inga produkter hittades.</p>
}
