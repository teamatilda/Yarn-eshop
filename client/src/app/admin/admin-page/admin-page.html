<!-- ADMIN PAGE-->

<!--All products-->
<app-admin-header></app-admin-header>

<div class="title">
<h2>Produkter</h2>
<button routerLink="/admin/products/new">Ny produkt</button>
</div>

<div class="product-table">
<table>
    <thead>
    <tr>
        <th>Namn</th>
        <th>ID</th>
        <th>Pris</th> 
    </tr>
    </thead>
    <tbody>
        @for (product of products(); track product.ID) {
            <tr>
                <td>{{ product.Title }}</td>
                <td>{{ product.ID }}</td>
                <td>{{ product.Price }}</td>
            </tr>
        }
    </tbody>
</table>
</div>
