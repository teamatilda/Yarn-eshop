<!-- New product in admin -->

<!--Header-->
<h2>Ny produkt</h2>

<!--Form-->

<form (ngSubmit)="onSubmit()">
    <h3>Namn</h3>
    <input type="text" name="title" [(ngModel)]="title" required />

    <h3>Beskrivning</h3>
    <input type="text" name="description" [(ngModel)]="description" required />

    <h3>Bild</h3>
    <input type="text" name="imageUrl" [(ngModel)]="imageUrl" placeholder="URL till bild" />

    <h3>Pris</h3>
      <input type="number" name="price" [(ngModel)]="price" required min="0" step="0.01" />

    <button type="submit" class="add-button">Lägg till</button>

</form>
